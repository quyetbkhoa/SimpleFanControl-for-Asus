name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set assembly version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)(?:\.(\d+))?$') {
            throw "Release tags must look like v2.1 or v2.1.0."
          }

          $patch = if ($Matches[3]) { $Matches[3] } else { "0" }
          $version = "$($Matches[1]).$($Matches[2]).$patch.0"
          $assemblyInfoFiles = @(
            "AsusFanControl\Properties\AssemblyInfo.cs",
            "AsusFanControlGUI\Properties\AssemblyInfo.cs"
          )

          foreach ($file in $assemblyInfoFiles) {
            $content = Get-Content -LiteralPath $file -Raw
            $content = $content -replace '"2\.\d+\.\d+\.0"', "`"$version`""
            Set-Content -LiteralPath $file -Value $content -Encoding UTF8
          }

      - name: Build solution
        shell: powershell
        run: |
          msbuild AsusFanControl.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /fl
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== MSBUILD LOG ==="
            Get-Content msbuild.log | ForEach-Object { Write-Host $_ }
            exit $LASTEXITCODE
          }

      - name: Create release ZIP
        id: package
        shell: powershell
        run: |
          $releaseName = if ($env:GITHUB_REF_TYPE -eq "tag") {
            "SimpleFanControl-for-Asus-$env:GITHUB_REF_NAME-win-x64"
          } else {
            "SimpleFanControl-for-Asus-ci-$($env:GITHUB_SHA.Substring(0, 7))-win-x64"
          }

          $stage = Join-Path $env:RUNNER_TEMP $releaseName
          $zip = Join-Path $env:RUNNER_TEMP "$releaseName.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          if (Test-Path "bin") {
            Write-Host "Contents of bin directory:"
            Get-ChildItem -Path "bin" -Recurse | Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "::error::bin directory does not exist!"
          }

          $releaseFiles = @(
            "bin\x64\Release\AsusFanControl.exe",
            "AsusFanControl\AsusWinIO64.dll",
            "bin\x64\Release\SimpleFanControlForAsus.exe",
            "bin\x64\Release\SimpleFanControlForAsus.exe.config",
            "packaging\README-EN-VI.txt"
          )

          foreach ($file in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
              Write-Host "::error::Required release file is missing: $file"
              throw "Required release file is missing: $file"
            }
            Write-Host "Adding to release: $file"
            Copy-Item -LiteralPath $file -Destination $stage
          }

          if (Test-Path "bin\x64\Release\AsusFanControl.exe.config") {
            Copy-Item -LiteralPath "bin\x64\Release\AsusFanControl.exe.config" -Destination $stage
          }

          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $stage "LICENSE.txt")
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal

          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$releaseName" -Encoding UTF8

      - name: Install Inno Setup
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            throw "ISCC.exe not found after installation!"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$isccPath"

      - name: Prepare Release Directory for Inno Setup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "packaging\Output"
          Copy-Item -LiteralPath "AsusFanControl\AsusWinIO64.dll" -Destination "bin\x64\Release\" -Force
          Copy-Item -LiteralPath "packaging\README-EN-VI.txt" -Destination "bin\x64\Release\" -Force
          Copy-Item -LiteralPath "LICENSE" -Destination "bin\x64\Release\LICENSE.txt" -Force

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          Write-Host "Running ISCC at: $env:ISCC_PATH"
          & "$env:ISCC_PATH" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC compiler failed with exit code $LASTEXITCODE"
          }

      - name: Copy Setup installer artifact
        id: setup_package
        shell: powershell
        run: |
          $setupFile = "packaging\Output\SimpleFanControlForAsus_Setup.exe"
          if (Test-Path $setupFile) {
            $destSetup = Join-Path $env:RUNNER_TEMP "SimpleFanControlForAsus_Setup.exe"
            Copy-Item -LiteralPath $setupFile -Destination $destSetup
            Add-Content -Path $env:GITHUB_OUTPUT -Value "setup=$destSetup" -Encoding UTF8
          }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            packaging/Output/SimpleFanControlForAsus_Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseFiles = Get-ChildItem -LiteralPath "release" | Select-Object -ExpandProperty FullName
          if (-not $releaseFiles) {
            throw "The release artifacts were not downloaded."
          }

          $null = gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $releaseFiles --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $releaseFiles `
              --title "SimpleFanControl for Asus $env:GITHUB_REF_NAME" `
              --generate-notes `
              --verify-tag
          }

